# =============================================================================
# Ivonne & Rosa — Integración continua
#
# - quality:     lint · typecheck · unit · build (+ seed BASE empaquetable + sintaxis de scripts)
# - integration: pruebas de integración contra PostgreSQL 16 (servicio)
# - docker:      construye la imagen de producción y la arranca (health + readiness + migraciones)
# - e2e:         Playwright (manual: Actions → CI → Run workflow → e2e = true)
#
# NO hay paso de deploy: Dokploy despliega solo desde GitHub (webhook / autodeploy en main).
# =============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      e2e:
        description: "Correr también las pruebas E2E (Playwright)"
        type: boolean
        default: false
      docker:
        description: "Construir y probar la imagen Docker"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  CHECKPOINT_DISABLE: "1"
  PRISMA_HIDE_UPDATE_MESSAGE: "1"
  TZ: America/Mexico_City

jobs:
  quality:
    name: Lint · Typecheck · Unit · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Valores de marcador: el build NUNCA necesita una base real ni secretos.
      SKIP_ENV_VALIDATION: "1"
      DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public
      AUTH_SECRET: ci-only-placeholder-secret-0000000000
      AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      # La versión de pnpm (9.15.9) se toma de package.json → "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Pruebas unitarias
        run: pnpm test

      - name: Sintaxis de scripts shell
        run: |
          for f in scripts/docker-entrypoint.sh scripts/backup/*.sh; do
            bash -n "$f" && echo "ok  $f"
          done
          if grep -l $'\r' scripts/docker-entrypoint.sh scripts/backup/*.sh; then
            echo "::error::Los scripts .sh deben tener finales de línea LF"; exit 1
          fi

      - name: Seed BASE empaquetable (producción)
        run: node scripts/seed-base/build.mjs

      - name: Caché de Next.js
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.css') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

  integration:
    name: Pruebas de integración
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ivonne
          POSTGRES_PASSWORD: ivonne_ci_pw
          POSTGRES_DB: ivonne_rosa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ivonne -d ivonne_rosa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ivonne:ivonne_ci_pw@localhost:5432/ivonne_rosa_test?schema=public
      TEST_DATABASE_URL: postgresql://ivonne:ivonne_ci_pw@localhost:5432/ivonne_rosa_test?schema=public
      AUTH_SECRET: ci-only-placeholder-secret-0000000000
      APP_URL: http://localhost:3000
      STORAGE_DRIVER: local
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Migraciones en la base de pruebas
        run: pnpm test:integration:prepare

      - name: Pruebas de integración
        run: pnpm test:integration

  docker:
    name: Imagen Docker (build + arranque)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.docker) || contains(github.event.pull_request.labels.*.name, 'docker')
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ivonne
          POSTGRES_PASSWORD: ivonne_ci_pw
          POSTGRES_DB: ivonne_rosa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ivonne -d ivonne_rosa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ivonne-rosa:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Arrancar el contenedor (migraciones + seed BASE al iniciar)
        run: |
          docker run -d --name ir-app --network host \
            -e DATABASE_URL="postgresql://ivonne:ivonne_ci_pw@127.0.0.1:5432/ivonne_rosa?schema=public" \
            -e AUTH_SECRET="ci-only-placeholder-secret-0000000000" \
            -e AUTH_URL="http://localhost:3000" -e APP_URL="http://localhost:3000" -e AUTH_TRUST_HOST=true \
            -e RUN_SEED_BASE=true -e SEED_ADMIN_EMAIL=admin.ci@ivonne-rosa.test -e SEED_ADMIN_PASSWORD=ci-admin-password-123 \
            -e STORAGE_DRIVER=s3 -e STORAGE_ENDPOINT=http://127.0.0.1:9000 -e STORAGE_BUCKET=ci \
            -e STORAGE_ACCESS_KEY=ci -e STORAGE_SECRET_KEY=ci-secret \
            ivonne-rosa:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            sleep 2
          done
          docker logs ir-app

      - name: Health y readiness
        run: |
          curl -fsS http://127.0.0.1:3000/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:3000/api/health/db | tee /dev/stderr | grep -q '"database":"up"'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)
          echo "GET / → $code"; test "$code" = "200"
          test "$(docker inspect -f '{{.Config.User}}' ivonne-rosa:ci)" = "nextjs"

      - name: Logs del contenedor
        if: always()
        run: docker logs ir-app || true

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ivonne
          POSTGRES_PASSWORD: ivonne_ci_pw
          POSTGRES_DB: ivonne_rosa_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ivonne -d ivonne_rosa_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      DATABASE_URL: postgresql://ivonne:ivonne_ci_pw@localhost:5432/ivonne_rosa_e2e?schema=public
      E2E_DATABASE_URL: postgresql://ivonne:ivonne_ci_pw@localhost:5432/ivonne_rosa_e2e?schema=public
      AUTH_SECRET: ci-only-placeholder-secret-0000000000
      AUTH_TRUST_HOST: "true"
      STORAGE_DRIVER: local
      PAYMENT_PROVIDER: mock
      EMAIL_PROVIDER: mock
      WHATSAPP_PROVIDER: mock
      AI_PROVIDER: mock
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Navegadores de Playwright
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts levanta scripts/e2e-server.mjs (build + start en :3200) y
      # tests/e2e/global-setup.ts migra y siembra la base E2E.
      - name: Pruebas E2E
        run: pnpm test:e2e

      - name: Reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
